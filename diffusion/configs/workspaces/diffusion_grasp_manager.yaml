_target_: workspaces.diffusion_grasp_workspace_manager.DiffusionGraspManager
_recursive_: false

dataset_fn:
  _target_: environments.diffusion_grasp.dataloader.get_train_val
  data_directory: ${data_path}
  embedding_directory: ${embedding_path}
  external_grasp_directory: ${external_grasp_path}
  internal_grasp_directory: ${internal_grasp_path}
  subbatch_size: 100 #num grasps per object for each sample. when 1 ist fast enough use 1.
  train_fraction: 0.95
#  random_seed: ${seed}
  device: ${device}
  processor:
    _target_: processors.diffusion_grasp_processor.DiffusionGraspProcessor
    representation: 'grasp_representation'
    sampler: 'vertices_sampler'
    transform: 'se3_transform'
    num_points: ${pc_dim}
    use_normals: True



seed: ${seed}
train_batch_size: 80
test_batch_size: 20
num_workers: 4
eval_n_times: 100
eval_n_steps: 300
device: ${device}
#scale_data: ${scale_data}
train_fraction: 0.95
render: False


