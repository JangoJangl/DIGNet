_target_: agents.diffusion_agents.grasp_diffusion_agent.GraspDiffusionAgent # agents.joint_ibc_agent.PlanarRobotJointIBCAgent  # agents.joint_distribution_ebm_agent.PlanarBotJointEBMAgent
_recursive_: false

defaults:
  - model: diffusion_model # diffusion_model

embedder:
  _target_: networks.vision_encoder.pointnet2.Pointnet2
  normal_channel: ${use_normals}
  output_dim: ${embedding_dim}

optimization:
  _target_: torch.optim.Adam
  lr: 5e-4 # for transformer
#  lr: 5e-4 # for MLP
  weight_decay: 0

eval_every_n_steps: ${eval_every_n_steps}
max_train_steps: ${max_train_steps}
n_timesteps: ${n_timesteps}
use_ema: ${use_ema}
decay: ${decay}
device: ${device}
update_ema_every_n_steps: ${update_ema_every_n_steps}
window_size: ${window_size}
evaluation: ${evaluation}
visualize_paths: ${visualize_paths}
