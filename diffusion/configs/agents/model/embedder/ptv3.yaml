_target_: networks.vision_encoder.ptv3.PTv3Encoder

output_dim: ${token_dim}
in_channels: 3 # 6 with use_normals
channels: [32, 64, 128, 256]
depths: [1, 1, 2, 1]
num_heads: [2, 4, 8, 16]
strides: [2, 2, 2] # 1024 points -> 128 tokens
patch_size: 128
k_neighbors: 16
grid_size: 0.002 # serialisation grid of the first stage in metre, doubled per stage
return_tokens: true
