_target_: networks.vision_encoder.pointnet2_local.PointNet2Local

output_dim: ${token_dim}
radius: 0.02 # smallest ball radius in metre, the MSG levels use r, 2r, 4r and 2r, 4r, 8r
num_tokens: 128
use_normals: ${use_normals}
return_tokens: true # false: global vector for the MLP denoiser (set embedding_dim=token_dim)
width: ${pointnet2_width} # channel multiplier of all set abstraction MLPs (2 -> about 4x parameters)
