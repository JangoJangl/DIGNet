_target_: networks.k_diffusion.score_wrappers.GCDenoiser
_recursive_: false

sigma_data: ${sigma_data}

inner_model:
  _target_: networks.k_diffusion.film_score_gpts.FiLMCondDiffusionGPT
  _recursive_: false
  state_dim: ${obs_dim}
  action_dim: ${action_dim}
  goal_dim: ${goal_dim}
  goal_conditioned: True
  embed_dim: ${hidden_dim}
  n_layers: ${num_hidden_layers}
  goal_seq_len: ${future_seq_length}
  obs_seq_len: ${window_size}
  sigma_vocab_size: ${n_timesteps}
  embed_pdrob: 0
  embed_fn:
    _target_: networks.k_diffusion.utils.return_time_sigma_embedding_model
     # 'GaussianFourier' 'FourierFeatures' or 'Sinusoidal'
    embedding_type: 'GaussianFourier'
    time_embed_dim: ${goal_dim} # ${t_dim} # ${hidden_dim}
    device: ${device}
  goal_drop: ${cond_mask_prob}
  attn_pdrop: 0.2
  resid_pdrop: 0.1
  # Architecture details
  n_heads: 6
  device: ${device}
  