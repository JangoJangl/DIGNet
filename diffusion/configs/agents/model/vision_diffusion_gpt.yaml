_target_: networks.k_diffusion.score_wrappers.GCDenoiser
_recursive_: false

sigma_data: ${sigma_data}

inner_model:
  _target_: networks.k_diffusion.score_gpts.VisionDiffusionGPT
  state_dim: ${latent_state_dim}
  action_dim: ${action_dim}
  goal_conditioned: ${goal_conditioning}
  embed_dim: ${hidden_dim}
  n_layers: ${num_hidden_layers}
  goal_seq_len: ${future_seq_length}
  obs_seq_len: ${window_size}
  sigma_vocab_size: ${n_timesteps}
  embed_pdrob: 0
  goal_drop: ${cond_mask_prob}
  attn_pdrop: 0.2
  resid_pdrop: 0.1
  # Architecture details
  n_heads: 12
  device: ${device}
  linear_output: True
  