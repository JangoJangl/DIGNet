agents:
  model:
    _target_: networks.diffusion.diffusion.Diffusion
    _recursive_: false
    condition_dim: ${embedding_dim}
    input_dim: ${grasp_dim}
    beta_schedule: ${beta_schedule}
    n_timesteps: ${n_timesteps}
    loss_type: l2
    clip_denoised: true
    predict_epsilon: ${predict_epsilon}
    device: ${device}
    diffusion_x: ${diffusion_x}
    diffusion_x_M: ${diffusion_x_M}
    model:
      _target_: ${model_target}
      input_dim: ${grasp_dim}
      cond_dim: ${embedding_dim}
      t_dim: ${t_dim}
      residual_style: ${residual_style}
      hidden_dim: ${hidden_dim}
      num_hidden_layers: ${num_hidden_layers}
      dropout: 0
      activation: ${activation}
      device: ${device}
  _target_: agents.diffusion_agents.grasp_diffusion_agent.GraspDiffusionAgent
  _recursive_: false
  embedder:
    _target_: networks.vision_encoder.pointnet2.Pointnet2
    normal_channel: ${use_normals}
    output_dim: ${embedding_dim}
  optimization:
    _target_: torch.optim.Adam
    lr: 0.0005
    weight_decay: 0
  eval_every_n_steps: ${eval_every_n_steps}
  max_train_steps: ${max_train_steps}
  n_timesteps: ${n_timesteps}
  use_ema: ${use_ema}
  decay: ${decay}
  device: ${device}
  update_ema_every_n_steps: ${update_ema_every_n_steps}
  window_size: ${window_size}
  evaluation: ${evaluation}
  visualize_paths: ${visualize_paths}
workspaces:
  _target_: workspaces.diffusion_grasp_workspace_manager.DiffusionGraspManager
  _recursive_: false
  dataset_fn:
    _target_: environments.diffusion_grasp.dataloader.get_train_val
    root_directory: ${root_path}
    data_directory: ${data_path}
    h5_directory: ${h5_path}
    subbatch_size: 100
    train_fraction: 0.98
    device: ${device}
    processor:
      _target_: processors.diffusion_grasp_processor.DiffusionGraspProcessor
      representation: ${representation}
      sampler: poisson_disk_sample
      transform: center_transform
      scaler: var_scale
      scale_factor: 1
      num_points: ${pc_dim}
      use_normals: ${use_normals}
      use_colors: false
      device: ${device}
      root_directory: ${root_path}
  seed: ${seed}
  train_batch_size: 4
  test_batch_size: 1
  num_workers: 0
  pin_memory: false
  eval_n_times: 100
  eval_n_steps: 300
  device: ${device}
  train_fraction: 0.95
  render: false
